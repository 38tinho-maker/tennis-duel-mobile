<script>
// Apostas da Polymarket: montagem a partir da API pública de dados (posições + atividade)
// e agregação por dia/semana/mês. Funções puras (testáveis em Node).

function apSlugify(s) {
  return String(s || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function apPalavras(s) {
  return apSlugify(s)
    .split("-")
    .filter((w) => w && !/^\d+$/.test(w));
}

function apCompat(a, b) {
  if (a === b) return true;
  if (a.length === 1 && b[0] === a) return true;
  if (b.length === 1 && a[0] === b) return true;
  return false;
}

function apNomesBatem(wa, wb) {
  if (!wa.length || !wb.length) return false;
  const [menor, maior] = wa.length <= wb.length ? [wa, wb] : [wb, wa];
  return menor.every((x) => maior.some((y) => apCompat(x, y)));
}

function apEhTenis(slug, eventSlug) {
  return /^(atp|wta|itf|challenger|tennis)/i.test(slug || "") || /^(atp|wta|itf|challenger|tennis)/i.test(eventSlug || "") || /tennis/i.test(slug || "");
}

function apNum(x) {
  const n = Number(x);
  return Number.isFinite(n) ? n : 0;
}

// Uma "aposta" = um mercado (conditionId) em que você comprou.
function apostasConstruir(activity, positions, closedCids, agoraSeg) {
  const agora = agoraSeg || Date.now() / 1000;
  const fechados = new Set(closedCids || []);
  const mapa = new Map();
  const pega = (cid) => {
    if (!mapa.has(cid)) mapa.set(cid, { cid, stake: 0, shares: 0, ret: 0, ts: null, compras: {}, title: "", slug: "", eventSlug: "" });
    return mapa.get(cid);
  };
  (activity || []).forEach((a) => {
    const cid = a.cid || a.conditionId;
    if (!cid) return;
    const tipo = String(a.t || a.type || "").toUpperCase();
    const lado = String(a.side || "").toUpperCase();
    const usd = apNum(a.usd !== undefined ? a.usd : a.usdcSize) || apNum(a.size) * apNum(a.price);
    const ts = apNum(a.ts !== undefined ? a.ts : a.timestamp);
    const b = pega(cid);
    if (!b.title) b.title = a.title || "";
    if (!b.slug) b.slug = a.slug || "";
    if (!b.eventSlug) b.eventSlug = a.eventSlug || a.es || "";
    if (tipo === "TRADE" && lado === "BUY") {
      b.stake += usd;
      b.shares += apNum(a.size);
      if (ts && (b.ts === null || ts < b.ts)) b.ts = ts;
      const o = a.out || a.outcome || "";
      b.compras[o] = (b.compras[o] || 0) + usd;
    } else if ((tipo === "TRADE" && lado === "SELL") || tipo === "REDEEM") {
      b.ret += usd;
    }
  });
  const posPorCid = new Map();
  (positions || []).forEach((p) => {
    const cid = p.conditionId;
    if (!cid) return;
    if (!posPorCid.has(cid)) posPorCid.set(cid, []);
    posPorCid.get(cid).push(p);
  });
  posPorCid.forEach((lista, cid) => {
    const b = pega(cid);
    if (!b.title) b.title = lista[0].title || "";
    if (!b.slug) b.slug = lista[0].slug || "";
    if (!b.eventSlug) b.eventSlug = lista[0].eventSlug || "";
    if (b.stake === 0) {
      // sem histórico: usa o que a posição informa
      b.stake = lista.reduce((s, p) => s + apNum(p.initialValue), 0);
      b.shares = lista.reduce((s, p) => s + apNum(p.totalBought || p.size), 0);
      lista.forEach((p) => (b.compras[p.outcome || ""] = (b.compras[p.outcome || ""] || 0) + apNum(p.initialValue)));
    }
  });
  const bets = [];
  mapa.forEach((b) => {
    if (b.stake <= 0) return;
    const lista = (posPorCid.get(b.cid) || []).filter((p) => apNum(p.size) > 0.01);
    const valorAtual = lista.reduce((s, p) => s + apNum(p.currentValue), 0);
    // Só vira "encerrada" com prova: posição resolvida, já vendida/resgatada, ou listada nas encerradas.
    // Posição que simplesmente não apareceu NÃO é perda: fica "aberta" sem valor conhecido.
    let status;
    let semPosicao = false;
    if (lista.length > 0) status = lista.every((p) => p.redeemable) ? "encerrada" : "aberta";
    else if (fechados.has(b.cid) || b.ret > 0) status = "encerrada";
    else if (b.ts && agora - b.ts > 24 * 3600) status = "encerrada"; // sem posição e já passou o dia: some da lista ao perder
    else {
      status = "aberta";
      semPosicao = true;
    }
    const retEfetivo = semPosicao ? b.stake : b.ret + valorAtual;
    const pnl = retEfetivo - b.stake;
    let resultado = status;
    if (status === "encerrada") resultado = pnl > 0.005 ? "ganhou" : pnl < -0.005 ? "perdeu" : "neutra";
    const outcome = Object.keys(b.compras).sort((x, y) => b.compras[y] - b.compras[x])[0] || (lista[0] && lista[0].outcome) || "";
    const avg = b.shares > 0 ? b.stake / b.shares : 0;
    bets.push({
      cid: b.cid,
      title: b.title,
      slug: b.slug,
      outcome,
      stake: b.stake,
      avgPrice: avg,
      cotas: b.shares,
      pnl,
      pct: b.stake > 0 ? (pnl / b.stake) * 100 : 0,
      retorno: retEfetivo,
      semPosicao,
      resultado, // aberta | ganhou | perdeu | neutra
      ts: b.ts, // segundos (1ª compra) ou null
      tenis: apEhTenis(b.slug, b.eventSlug),
    });
  });
  bets.sort((x, y) => (x.ts || 0) - (y.ts || 0));
  return bets;
}

// "Roncadelli vs. Angelo" / "Torneio: A vs B" -> [palavrasA, palavrasB]
function apTituloJogadores(title) {
  const t = String(title || "");
  const partes = t.split(/\s+vs\.?\s+/i);
  if (partes.length !== 2) return null;
  const esq = partes[0].split(":").pop();
  const dir = partes[1].split(/[:(\[]/)[0];
  const wa = apPalavras(esq);
  const wb = apPalavras(dir);
  return wa.length && wb.length ? [wa, wb] : null;
}

// Apostas que pertencem a um card (jogadores A e B). Devolve [{bet, lado:"A"|"B"|null}]
function apostasParaCard(bets, nomeA, nomeB, agoraSeg, janelaSeg) {
  const wA = apPalavras(nomeA);
  const wB = apPalavras(nomeB);
  const agora = agoraSeg || Date.now() / 1000;
  const out = [];
  (bets || []).forEach((bet) => {
    if (!bet.tenis) return;
    if (bet.resultado !== "aberta" && (!bet.ts || agora - bet.ts > (janelaSeg || 36 * 3600))) return;
    const jog = apTituloJogadores(bet.title);
    if (!jog) return;
    const direto = apNomesBatem(wA, jog[0]) && apNomesBatem(wB, jog[1]);
    const invertido = apNomesBatem(wA, jog[1]) && apNomesBatem(wB, jog[0]);
    if (!direto && !invertido) return;
    const wo = apPalavras(bet.outcome);
    let lado = null;
    if (apNomesBatem(wo, wA) && !apNomesBatem(wo, wB)) lado = "A";
    else if (apNomesBatem(wo, wB) && !apNomesBatem(wo, wA)) lado = "B";
    out.push({ bet, lado });
  });
  return out;
}

function apChaveDia(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function apInicioSemana(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dia = (x.getDay() + 6) % 7; // segunda = 0
  x.setDate(x.getDate() - dia);
  return x;
}

// tipo: "dia" | "semana" | "mes"; ref: Date. Só apostas com data conhecida.
function apostasPeriodo(bets, tipo, ref, soTenis) {
  let ini;
  let fim;
  if (tipo === "dia") {
    ini = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
    fim = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + 1);
  } else if (tipo === "semana") {
    ini = apInicioSemana(ref);
    fim = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + 7);
  } else {
    ini = new Date(ref.getFullYear(), ref.getMonth(), 1);
    fim = new Date(ref.getFullYear(), ref.getMonth() + 1, 1);
  }
  const lista = (bets || []).filter((b) => b.ts && (!soTenis || b.tenis) && b.ts * 1000 >= ini.getTime() && b.ts * 1000 < fim.getTime());
  return { ini, fim, bets: lista, totais: apTotais(lista) };
}

function apTotais(lista) {
  const apostado = lista.reduce((s, b) => s + b.stake, 0);
  const retorno = lista.reduce((s, b) => s + b.retorno, 0);
  const lucro = retorno - apostado;
  const fechadas = lista.filter((b) => b.resultado !== "aberta");
  const ganhas = fechadas.filter((b) => b.resultado === "ganhou").length;
  const abertas = lista.length - fechadas.length;
  const odds = lista.filter((b) => b.avgPrice > 0).map((b) => 1 / b.avgPrice);
  return {
    n: lista.length,
    apostado,
    retorno,
    lucro,
    roi: apostado > 0 ? (lucro / apostado) * 100 : 0,
    ganhas,
    fechadas: fechadas.length,
    abertas,
    oddMedia: odds.length ? odds.reduce((s, x) => s + x, 0) / odds.length : 0,
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { apostasConstruir, apostasParaCard, apostasPeriodo, apTotais, apTituloJogadores, apInicioSemana, apChaveDia, apPalavras };
}

</script>
<script>
const API="https://data-api.polymarket.com";
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const $=(s)=>document.querySelector(s);
const esc=(t)=>String(t).replace(/[&<>"]/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const din=(v,s)=>{const n=Number(v)||0;return `${n<0?"−":s?"+":""}$${Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`};
const cls=(v)=>v>0?"g":v<0?"r":"";
const curto=(n)=>{const p=String(n||"").trim().split(/\s+/);return p.length<2?p[0]||"":`${p[0][0].toUpperCase()}. ${p[p.length-1]}`};
const ls={get:(k)=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

  let h=`<div class="seg">${["dia","semana","mes"].map(x=>`<button data-t="${x}" class="${x===tipo?"on":""}">${x==="dia"?"Dia":x==="semana"?"Semana":"Mês"}</button>`).join("")}</div>
  <div class="nav"><button id="ant">◀</button><div class="t">📅 ${titulo(per)}<input type="date" id="dt" value="${apChaveDia(ref)}"></div><button id="prox">▶</button></div>`;
  if(atual.ini.getTime()!==per.ini.getTime())h+=`<button class="hoje" id="hoje">Voltar para hoje</button>`;
  const abertas=bets.filter(b=>b.tenis&&b.resultado==="aberta"&&!b.semPosicao);
  const hojeP=atual.ini.getTime()===per.ini.getTime();
  if(abertas.length&&hojeP){const ap=abertas.reduce((s,b)=>s+b.stake,0),pn=abertas.reduce((s,b)=>s+b.pnl,0);
    h+=`<button class="top" id="ab"><span>● ${abertas.length} aberta${abertas.length>1?"s":""} · ${din(ap)}</span><span class="${cls(pn)}">${din(pn,1)} ${aberta?"▴":"▾"}</span></button>`;
    if(aberta)h+=abertas.map(b=>`<div class="item"><div class="l1"><span>${esc(b.title)}</span><span class="${cls(b.pnl)}">${din(b.pnl,1)}</span></div><div class="l2">${esc(curto(b.outcome))} · a ${(b.avgPrice).toFixed(2).replace(".",",")} · ${Number(b.cotas).toLocaleString("pt-BR",{maximumFractionDigits:2})} cotas</div></div>`).join("")}
  if(erro)h+=`<div class="aviso">Última leitura falhou: ${esc(erro)}</div>`;
  h+=`<div class="kp"><div>Apostado<b>${din(t.apostado)}</b></div><div>Retorno<b>${din(t.retorno)}</b></div><div>Lucro<b class="${cls(t.lucro)}">${din(t.lucro,1)}</b></div><div>ROI<b class="${cls(t.roi)}">${t.roi>=0?"+":"−"}${Math.abs(t.roi).toFixed(0)}%</b></div><div>Acertos<b>${t.fechadas?`${t.ganhas} de ${t.fechadas}`:"—"}</b></div><div>${tipo==="dia"?"Abertas":"Odd média"}<b>${tipo==="dia"?t.abertas:t.oddMedia?t.oddMedia.toFixed(2).replace(".",","):"—"}</b></div></div>`;
  const lst=(tipo==="dia"&&hojeP&&abertas.length)?per.bets.filter(b=>b.resultado!=="aberta"):per.bets;
  if(!per.bets.length)h+=`<div class="vazio">Nenhuma aposta de tênis neste período.</div>`;
  else if(tipo==="dia"){
    h+=lst.map(b=>{const pill=b.resultado==="ganhou"?'<span class="pill w">ganhou</span>':b.resultado==="perdeu"?'<span class="pill l">perdeu</span>':b.resultado==="aberta"?'<span class="pill o">aberta</span>':'<span class="pill">encerrada</span>';
      const hr=new Date(b.ts*1000).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      return `<div class="item"><div class="l1"><span>${esc(b.title)}</span><span class="${cls(b.pnl)}">${din(b.pnl,1)}</span></div><div class="l2">${esc(curto(b.outcome))} · ${din(b.stake)} a ${(b.avgPrice).toFixed(2).replace(".",",")} · ${Number(b.cotas).toLocaleString("pt-BR",{maximumFractionDigits:2})} cotas · ${pill} · ${hr}</div></div>`}).join("");
  }else{
    const g=new Map();per.bets.forEach(b=>{const k=apChaveDia(new Date(b.ts*1000));if(!g.has(k))g.set(k,[]);g.get(k).push(b)});
    const n=Math.round((per.fim-per.ini)/864e5),dias=[];
    for(let i=0;i<n;i++){const d=new Date(per.ini.getFullYear(),per.ini.getMonth(),per.ini.getDate()+i),l=g.get(apChaveDia(d))||[];dias.push({d,l:l.reduce((s,b)=>s+b.pnl,0),n:l.length})}
    const mx=Math.max(1,...dias.map(x=>Math.abs(x.l)));
    h+=`<div class="bars">${dias.map(x=>`<i class="${x.n===0?"v":x.l<0?"n":""}" style="height:${x.n===0?2:Math.max(4,Math.round(Math.abs(x.l)/mx*100))}${x.n===0?"px":"%"}"></i>`).join("")}</div>`;
    h+=dias.filter(x=>x.n).reverse().map(x=>`<div class="item" data-d="${apChaveDia(x.d)}" style="cursor:pointer"><div class="l1"><span>${DIAS[x.d.getDay()]} ${String(x.d.getDate()).padStart(2,"0")}/${String(x.d.getMonth()+1).padStart(2,"0")} · ${x.n} jogo${x.n>1?"s":""}</span><span class="${cls(x.l)}">${din(x.l,1)}</span></div></div>`).join("");
  }
  app.innerHTML=h;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tipo=b.dataset.t;render()});
  $("#ant").onclick=()=>mover(-1);$("#prox").onclick=()=>mover(1);
  const hj=$("#hoje");if(hj)hj.onclick=()=>{ref=new Date();render()};
  const ab=$("#ab");if(ab)ab.onclick=()=>{aberta=!aberta;ls.set("abertas",aberta?"1":"0");render()};
  $("#dt").onchange=(e)=>{const[y,m,d]=e.target.value.split("-").map(Number);if(y){ref=new Date(y,m-1,d);render()}};
  app.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{const[y,m,d]=el.dataset.d.split("-").map(Number);ref=new Date(y,m-1,d);tipo="dia";render();scrollTo(0,0)});
}

const nc=(n)=>curto(n);
function sbRows(g,fim){
  const ns=g.sets.length,cur=fim?-1:ns-1;
  const row=(i)=>{const nome=i?g.b:g.a;let venc=false;if(fim){let sa=0,sb=0;g.sets.forEach(s=>{if(s[0]>s[1])sa++;else if(s[1]>s[0])sb++});venc=i?sb>sa:sa>sb}
    const cells=g.sets.map((s,k)=>{const m=s[i],o=s[1-i];return `<span class="st ${k===cur?"cur":m>o?"w":""}">${m}</span>`}).join("");
    const pt=!fim&&g.pt?g.pt[i]:"",sv=g.sv===(i?"b":"a");
    return `<div class="sr"><span class="sv ${sv&&!fim?"on":""}"></span><span class="nm" style="${venc?"color:#fff;font-weight:800":""}">${esc(nc(nome))}</span>${cells}${fim?`<span class="od" title="odd pré-jogo">${g.od0?Number(g.od0[i]).toFixed(2):""}</span>`:`<span class="pt">${pt==null?"":esc(pt)}</span><span class="od">${g.od?esc(g.od[i]):""}</span>`}</div>`};
  return row(0)+row(1);
}
function apHtml(g){
  return (g.ap||[]).map(a=>{const nome=a.l==="A"?g.a:a.l==="B"?g.b:a.o;const neg=a.p<0;
    const risco=!neg?"":"";
    return `<div class="ga"><span>💰 ${esc(nc(nome))}<small>${Number(a.c).toLocaleString("pt-BR",{maximumFractionDigits:2})} cotas · apostado ${din(a.s)}${a.st==="ganhou"?" · ganhou":a.st==="perdeu"?" · perdeu":""}</small></span><b class="${cls(a.p)}">${din(a.p,1)} (${a.pc>=0?"+":"−"}${Math.abs(a.pc).toFixed(0)}%)</b></div>`}).join("");
}
const money=(v)=>din(v);
function apEncHtml(g){
  return (g.ap||[]).map(a=>{const nome=a.l==="A"?g.a:a.l==="B"?g.b:a.o;const pr=a.c>0?a.s/a.c:null;
    return `<div class="ga"><span>💰 ${esc(nc(nome))}${pr?` · a ${pr.toFixed(2).replace(".",",")}`:""} · ${Number(a.c).toLocaleString("pt-BR",{maximumFractionDigits:2})} cotas<small>apostado ${money(a.s)} → recebeu ${money(a.r||0)}</small></span><b class="${cls(a.p)}">${din(a.p,1)}${a.st==="ganhou"?" ganhou":a.st==="perdeu"?" perdeu":""}</b></div>`}).join("");
}
function duracao(ms){if(!(ms>60000))return"";const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m+" min"}
function exEncHtml(g){
  const hh=(ts)=>new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  const bets=(g.ap||[]).map(a=>{const nome=a.l==="A"?g.a:a.l==="B"?g.b:a.o;const pr=a.c>0?a.s/a.c:null;
    return `<div class="eg"><b>${esc(nc(nome))}</b><span>Apostado<b>${money(a.s)}</b></span><span>Recebeu<b>${money(a.r||0)}</b></span><span>Lucro<b class="${cls(a.p)}">${din(a.p,1)} (${a.pc>=0?"+":"−"}${Math.abs(a.pc).toFixed(0)}%)</b></span><span>Preço → odd<b>${pr?pr.toFixed(2).replace(".",",")+" → "+(1/pr).toFixed(2).replace(".",","):"—"}</b></span><span>Cotas<b>${Number(a.c).toLocaleString("pt-BR",{maximumFractionDigits:2})}</b></span><span>Aposta às<b>${a.ts?hh(a.ts*1000):"—"}</b></span></div>`}).join("");
  const dur=g.t0&&g.fim?duracao(g.fim-g.t0):"";
  const jogo=`<div class="eg"><b>Jogo</b>${g.fim?`<span>Terminou<b>${horaFim(g.fim)}</b></span>`:""}<span>Sets<b>${g.sets.map(s=>s[0]+"-"+s[1]).join(" ")}</b></span>${dur?`<span>Acompanhado ao vivo<b>${dur}</b></span>`:""}${g.od0?`<span>Odd pré-jogo<b>${Number(g.od0[0]).toFixed(2)} × ${Number(g.od0[1]).toFixed(2)}</b></span>`:""}</div>`;
  return `<div class="ex">${bets}${jogo}</div>`+retHtml(g)}
function emRisco(g){ // aposta no jogador que está atrás em sets
  if(!g.sets.length||!(g.ap||[]).length)return false;
  let sa=0,sb=0;g.sets.slice(0,-1).forEach(s=>{if(s[0]>s[1])sa++;else if(s[1]>s[0])sb++});
  return g.ap.some(a=>a.st==="aberta"&&((a.l==="A"&&sb>sa)||(a.l==="B"&&sa>sb)));
}
function horaFim(ms){if(!ms)return"";const d=new Date(ms),h=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===new Date().toDateString()?h:"ontem "+h}
function renderLive(){
  const app=$("#app");

    $("#gok").onclick=()=>{gistId=$("#gi").value.trim().split("/").pop().replace(/[^0-9a-zA-Z]/g,"");gtoken=$("#gt").value.replace(/[^0-9a-zA-Z_]/g,"");ls.set("gist",gistId);ls.set("gtoken",gtoken);lerFeed();render()};return}

  if(feed){const idade=Math.round((Date.now()-feed.t)/1000);if(idade>90)h+=`<div class="stale">⚠ PC sem atualizar há ${idade>3600?Math.round(idade/3600)+" h":Math.round(idade/60)+" min"} — dados podem estar velhos.</div>`}

    h+=[...L].sort((x,y)=>(emRisco(y)-emRisco(x))||((y.ap||[]).length-(x.ap||[]).length)).map(g=>{
      let sa=0,sb=0;g.sets.slice(0,-1).forEach(s=>{if(s[0]>s[1])sa++;else if(s[1]>s[0])sb++});
      return `<div class="gc"><div class="gh"><span>${esc(g.tor||"")}${g.piso?" · "+esc(g.piso):""}${emRisco(g)?'<span class="chip">⚠ em risco</span>':""}${viTag(g)}</span></div>
      <div class="sb"><div class="sbh"><span><span class="lv">● AO VIVO</span> · ${esc(g.et||"")}</span><span>sets ${sa}–${sb}</span></div>${g.sets.length?sbRows(g,false):""}</div>${apHtml(g)}${cardBase(g,abertos.has(g.k))}</div>`}).join("");
  }else{
    const aps=enc.filter(passa).flatMap(g=>g.ap),lucro=aps.reduce((s,a)=>s+a.p,0),ac=aps.filter(a=>a.p>0).length;
    h+=`<div class="kp"><div>Lucro<b class="${cls(lucro)}">${din(lucro,1)}</b></div><div>Acertos<b>${ac}/${aps.length}</b></div><div>Período<b style="font-size:13px">hoje+ontem</b></div></div>`;
    const E=enc.filter(passa);if(!E.length)h+=`<div class="vazio">Nenhum jogo encerrado com aposta${enc.length?" nesses filtros":""}.</div>`;
    h+=E.map(g=>{let sa=0,sb=0;g.sets.forEach(s=>{if(s[0]>s[1])sa++;else if(s[1]>s[0])sb++});const tot=g.ap.reduce((s,a)=>s+a.p,0);
      return `<div class="gc"><div class="gh"><span>🏁 ${g.fim?"terminou "+horaFim(g.fim)+" · ":""}${esc(g.tor||"")}</span><b class="${cls(tot)}">${din(tot,1)}</b></div>
      <div class="sb"><div class="sbh"><span><b>ENCERRADO</b></span><span>sets ${sa}–${sb}</span></div>${g.sets.length?sbRows(g,true):""}</div>${apEncHtml(g)}${abertos.has(g.k)?exEncHtml(g):""}<button class="cv" data-cv="${esc(g.k)}">${abertos.has(g.k)?"▴ recolher":"▾ detalhes"}</button></div>`}).join("");

  const rb=q("#rgbox");if(rb)regrasUI(rb,flt.rg,{onChange:()=>{svFlt();render()}});

let lendoFeed=false;
async function lerFeed(){
  if(!gistId||!gtoken||lendoFeed)return;lendoFeed=true;
  try{
    const r=await fetch("https://api.github.com/gists/"+gistId,{headers:{Authorization:"Bearer "+gtoken,Accept:"application/vnd.github+json"}});
    if(!r.ok)throw new Error(r.status===401?"token recusado (401) — toque em ⚙️ e cole o token de novo":r.status===404?"gist não encontrado (404) — confira o ID em ⚙️":"GitHub "+r.status);
    const j=await r.json(),f=j.files&&j.files["feed.json"];
    if(!f)throw new Error("feed.json não encontrado");
    feed=JSON.parse(f.content);feedErro="";
    $("#st").textContent="atualizado "+new Date(feed.t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }catch(e){feedErro=String(e.message||e)}
  lendoFeed=false;if(modo==="live"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))render();
}
function setModo(m){cfgOn=false;modo=m;ls.set("modo",m);$("#m-live").classList.toggle("on",m==="live");$("#m-ct").classList.toggle("on",m==="ct");if(m==="live")lerFeed();render()}
$("#m-live").onclick=()=>setModo("live");$("#m-ct").onclick=()=>setModo("ct");
setInterval(()=>{if(modo==="live"&&!document.hidden)lerFeed()},5000);
